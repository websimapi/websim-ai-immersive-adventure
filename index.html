<html>
<head>
    <title>AI Immersive Adventure</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #panorama-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            z-index: 1; /* Behind UI elements */
        }
        #panorama-container:active {
            cursor: grabbing;
        }
        .ui-overlay {
             position: absolute;
             background-color: rgba(0, 0, 0, 0.7);
             padding: 15px;
             border-radius: 8px;
             text-align: center;
             z-index: 10; /* Ensure it's above the canvas */
             max-height: 80vh; /* Limit height */
             overflow-y: auto; /* Allow scrolling if content exceeds max height */
        }

        #loading-indicator, #error-message {
            /* Use shared overlay class */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
         #error-message {
            color: #ff8888; /* Changed back to a lighter red */
            display: none; /* Hidden by default */
         }

        #prompt-display {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.9em;
            max-width: 80%;
            text-align: center;
            z-index: 10;
        }

        #object-detection-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 10;
            max-height: calc(100vh - 100px); /* Prevent overlapping with prompt */
            overflow-y: auto;
            font-size: 0.85em;
            max-width: 200px;
            display: none; /* Hidden initially */
        }
         #object-detection-container h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
         }
        #object-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #object-list li {
            margin-bottom: 4px;
            text-transform: capitalize;
        }
        #object-list .score {
            color: #aaa;
            font-size: 0.9em;
            margin-left: 5px;
        }
        #detection-status {
            font-style: italic;
            color: #bbb;
            margin-top: 5px;
            font-size: 0.9em;
        }

    </style>
</head>
<body>
    <div id="panorama-container"></div>

    <div id="loading-indicator" class="ui-overlay">
        <p>Generating immersive environment...</p>
        <p id="loading-subtext">This might take a moment.</p>
    </div>
     <div id="error-message" class="ui-overlay">
        <p>Failed to generate the environment. Please try refreshing.</p>
     </div>

    <div id="prompt-display">Prompt: Initializing...</div>

    <div id="object-detection-container">
        <h3>Detected Objects</h3>
        <div id="detection-status">Detecting...</div>
        <ul id="object-list">
            <!-- Detected objects will be listed here -->
        </ul>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
            "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.19.0/dist/tf.es2017.min.js",
            "@tensorflow-models/coco-ssd": "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
